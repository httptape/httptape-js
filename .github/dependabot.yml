# .github/dependabot.yml
#
# Dependabot v2 configuration for httptape-js.
#
# Scope:
#   - npm dependencies across the pnpm workspace (root manifest + all
#     packages/* members; pnpm workspaces resolve from the root lockfile,
#     so a single root entry covers every member).
#   - GitHub Actions used by the ci.yml / release.yml workflows.
#
# Grouping policy:
#   - Minor + patch updates per ecosystem are batched into a single PR
#     (`minor-and-patch` group); major updates ship as individual PRs so
#     each likely-breaking change is reviewed in isolation.
#
# Cadence:
#   - Weekly on Mondays at 09:00 UTC — matches the httptape core repo.
#
# Labels:
#   - `dependencies` plus an ecosystem tag (`npm` / `github-actions`).

version: 2
updates:
  # ----- npm: pnpm workspace (root covers packages/* members) -----
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    ignore:
      # typescript-eslint 8.72 peers on typescript ">=4.8.4 <6.1.0", so
      # TypeScript 7 breaks linting. Drop once typescript-eslint supports it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Vitest 5 requires Node 22, but CI still tests Node 20 and the
      # packages declare engines.node ">=20". Drop once Node 20 support ends.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]

  # ----- GitHub Actions (ci.yml, release.yml) -----
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
